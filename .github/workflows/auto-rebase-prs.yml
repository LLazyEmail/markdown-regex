# Keep open PRs current automatically. Runs after every push to main:
# behind PRs get GitHub's update-branch; conflicting PRs get one comment
# per head SHA listing the conflicting files (nothing is force-pushed).
# Manual dispatch can target PRs and opt in to a real rebase (owner approval).
# Renovate/Dependabot PRs are handed back to the bot (delegate-bot-rebase):
# Renovate's rebase checkbox is ticked so it regenerates pnpm-lock.yaml itself.
name: Auto-rebase open PRs

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      pr-numbers:
        description: Comma-separated PR numbers; empty selects all open PRs
        type: string
        default: ''
      rebase-conflicts:
        description: Allow git rebase and force-push with lease for conflicts
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-auto-rebase.yml@v2
    with:
      pr-numbers: ${{ inputs.pr-numbers || '' }}
      rebase-conflicts: ${{ inputs.rebase-conflicts || false }}
      report-conflicts: true
      delegate-bot-rebase: true
      conflict-label: has-conflicts
      # Make PRs this run can't fix visible (DA v2.16.0+): a sweep that skips a
      # conflicting PR turns the run red, and PRs whose checks are red get a
      # warning, a summary column and the checks-failing label. Check names need
      # the AUTO_REBASE_TOKEN secret (a PAT that can read checks); without it the
      # action uses GitHub's "unstable" merge state.
      # Reported conflicts (report-conflicts) also turn the run red once DA ships
      # documentation-actions#201 (next release after v2.16.0); until then
      # this only covers PRs a sweep skips.
      fail-on-skipped-conflicts: true
      report-failing-checks: true
      failing-checks-label: checks-failing
      comment-on-update: ${{ github.event_name != 'push' }}
    secrets: inherit
