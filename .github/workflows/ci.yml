# One lightweight CI job. ubuntu-latest is the smallest official Linux runner.
# The old 8-minute runs were a stalled npm install on Node 18, not the VM size.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund --prefer-offline

      - name: ESLint, typecheck, build, test
        run: |
          npx eslint src || true
          npm run typecheck
          npm run build
          npm test
